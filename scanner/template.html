<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Doctor</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --raised: #ffffff; --ink: #141413; --ink-2: #52514e; --ink-3: #8a8983;
  --line: #e3e1da; --line-2: #ecebe5; --chip: #efeee9;
  --accent: #2a78d6; --accent-soft: #e6f0fc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #6250d6;
  --qt-hi: #ffffff; --q150: #e4eefb; --q250: #b7d3f6; --q350: #6da7ec; --q450: #2a78d6; --q550: #184f95;
  --crit: #c4322b; --crit-bg: #fbe9e7; --warn: #a15c00; --warn-bg: #fdf1dc; --good: #1d7a3e; --good-bg: #e6f4ea; --info: #52514e; --info-bg: #efeee9;
  --hatch: #d8d6cf;
  --shadow: 0 1px 2px rgba(20,20,19,.04), 0 4px 16px rgba(20,20,19,.04);
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --raised: #20201e; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8c8b84;
  --line: #2f2e2b; --line-2: #272724; --chip: #2a2a27;
  --accent: #3987e5; --accent-soft: #1c2b40;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9;
  --qt-hi: #0b0b0b; --q150: #232c38; --q250: #1c4a85; --q350: #256abf; --q450: #5598e7; --q550: #9ec5f4;
  --crit: #f0857c; --crit-bg: #3a1d1a; --warn: #e8b458; --warn-bg: #36290f; --good: #7cc995; --good-bg: #16301f; --info: #c3c2b7; --info-bg: #2a2a27;
  --hatch: #3a3935;
  --shadow: none;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --raised: #20201e; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8c8b84;
  --line: #2f2e2b; --line-2: #272724; --chip: #2a2a27;
  --accent: #3987e5; --accent-soft: #1c2b40;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9;
  --qt-hi: #0b0b0b; --q150: #232c38; --q250: #1c4a85; --q350: #256abf; --q450: #5598e7; --q550: #9ec5f4;
  --crit: #f0857c; --crit-bg: #3a1d1a; --warn: #e8b458; --warn-bg: #36290f; --good: #7cc995; --good-bg: #16301f; --info: #c3c2b7; --info-bg: #2a2a27;
  --hatch: #3a3935;
  --shadow: none;
}
* { box-sizing: border-box }
html { scroll-behavior: smooth; scroll-padding-top: 72px }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased }
.mono, code { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px 80px }
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-bottom: 0; min-height: 56px; flex-wrap: wrap }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em }
.brand svg { color: var(--accent) }
.top nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none }
.top nav a { color: var(--ink-2); text-decoration: none; font-size: 13.5px; padding: 8px 10px; border-radius: 8px; white-space: nowrap }
.top nav a:hover { background: var(--chip); color: var(--ink) }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer }
.iconbtn:hover { color: var(--ink) }
section { padding-top: 40px }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500 }
h2 { font-size: 21px; font-weight: 600; letter-spacing: -.01em; margin: 4px 0 6px }
.lede { color: var(--ink-2); margin: 0 0 18px; max-width: 76ch; font-size: 14.5px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow) }
.muted { color: var(--ink-2) } .faint { color: var(--ink-3) } .small { font-size: 13px } .num { font-variant-numeric: tabular-nums }
/* hero */
.hero { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; padding-top: 28px }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr } }
.score { display: flex; flex-direction: column; gap: 14px }
.score .big { display: flex; align-items: baseline; gap: 8px }
.score .big b { font-size: 64px; line-height: 1; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.score .big span { font-size: 22px; color: var(--ink-3) }
.band { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; padding: 3px 10px; border-radius: 999px }
.meter { display: grid; grid-template-columns: 96px 1fr 34px; gap: 10px; align-items: center; font-size: 13.5px }
.meter .segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px }
.meter .segs i { height: 8px; border-radius: 3px; background: var(--line) }
.meter .segs i.on { background: var(--accent) }
.src { font-size: 12px; color: var(--ink-3); border-top: 1px dashed var(--line); padding-top: 10px }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow) }
.tile .v { font-size: 28px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2 }
.tile .k { font-size: 13px; color: var(--ink-2) }
.tile .d { font-size: 12px; color: var(--ink-3); margin-top: 4px }
.tile.alert .v { color: var(--crit) }
/* stack bars */
.stack { display: flex; flex-direction: column; gap: 22px }
.barrow .head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; flex-wrap: wrap }
.barrow .head b { font-weight: 600 }
.bar { display: flex; gap: 2px; height: 34px; border-radius: 8px; overflow: hidden }
.bar > div { height: 100%; position: relative; min-width: 3px; transition: filter .15s }
.bar > div:first-child { border-radius: 8px 0 0 8px } .bar > div:last-child { border-radius: 0 8px 8px 0 }
.bar > div:hover { filter: brightness(1.08) }
.bar .ovf { background: repeating-linear-gradient(45deg, var(--hatch) 0 2px, transparent 2px 7px); border: 1px dashed var(--ink-3) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: var(--ink-2) }
.legend span { display: inline-flex; align-items: center; gap: 7px }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none }
.legend b { color: var(--ink); font-weight: 500 }
/* treemap */
.tm { position: relative; width: 100%; aspect-ratio: 2.1 / 1; min-height: 300px }
.tm .cell { position: absolute; padding: 1px }
.tm .cell > div { width: 100%; height: 100%; border-radius: 6px; padding: 8px 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; cursor: default; transition: transform .12s }
.tm .cell > div:hover { outline: 2px solid var(--ink); outline-offset: -2px }
.tm .n { font-weight: 600; font-size: 13.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tm .m { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.scale { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap }
.scale i { width: 26px; height: 10px; border-radius: 2px; display: inline-block }
/* findings */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px }
.pill { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; min-height: 36px }
.pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.findings { display: grid; gap: 10px }
details.f { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow) }
details.f > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; min-height: 44px }
details.f > summary::-webkit-details-marker { display: none }
details.f > summary .t { font-weight: 500 }
details.f > summary .chev { color: var(--ink-3); transition: transform .15s; margin-top: 3px }
details.f[open] > summary .chev { transform: rotate(90deg) }
details.f .body { padding: 0 16px 16px 16px; display: grid; gap: 10px; font-size: 14px }
details.f .body .ev { color: var(--ink-2); overflow-wrap: anywhere }
details.f .fix { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px }
details.f .fix b { color: var(--accent) }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap }
.sev.p0 { color: var(--crit); background: var(--crit-bg) } .sev.p1 { color: var(--warn); background: var(--warn-bg) } .sev.p2 { color: var(--info); background: var(--info-bg) }
.badge { font-size: 11.5px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; margin-left: 8px; white-space: nowrap; vertical-align: 1px }
.badge.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent) }
/* lifecycle */
.flow { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; counter-reset: step }
.ev { position: relative }
.evnode { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; height: 100%; box-shadow: var(--shadow) }
.evnode h4 { margin: 0 0 2px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px }
.evnode h4 .c { font-weight: 500; color: var(--ink-3); font-size: 12.5px }
.evnode .when { font-size: 12px; color: var(--ink-3); margin-bottom: 10px }
.hk { display: flex; flex-direction: column; gap: 5px }
.hk span { font-size: 12.5px; padding: 4px 8px; border-radius: 6px; background: var(--chip); color: var(--ink-2); overflow-wrap: anywhere; line-height: 1.45 }
.hk span.beh { background: var(--warn-bg); color: var(--warn) }
.hk span.beh.doc { background: var(--good-bg); color: var(--good) }
.hk span small { display: block; opacity: .8; font-size: 11.5px }
/* owners */
.owners { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px }
.owner h4 { margin: 0; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.owner .cnt { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums }
.owner .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; max-height: 120px; overflow: hidden; mask-image: linear-gradient(to bottom, #000 75%, transparent) }
.chip { font-size: 12px; background: var(--chip); color: var(--ink-2); border-radius: 6px; padding: 2px 8px }
.chip.hot { background: var(--crit-bg); color: var(--crit) }
.chip.own { background: var(--good-bg); color: var(--good) }
/* conflicts */
.pair { display: grid; grid-template-columns: 1fr 44px 1fr; align-items: stretch; margin-bottom: 14px }
@media (max-width: 760px) { .pair { grid-template-columns: 1fr } .pair .vs { height: 28px } }
.pair .side { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow) }
.pair .side h5 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 500 }
.pair .vs { display: grid; place-items: center; color: var(--crit); font-weight: 600; font-size: 13px }
.rule { padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 13.5px } .rule:last-child { border: 0; padding-bottom: 0 }
.rule .w { font-size: 11.5px; font-weight: 600; margin-right: 6px }
.rule .w.no { color: var(--crit) } .rule .w.yes { color: var(--good) }
.rule .s { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px }
/* explorer */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--ink-2); cursor: pointer; margin-bottom: -1px; min-height: 44px; white-space: nowrap }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500 }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px }
.toolbar input { flex: 1; min-width: 200px }
input[type=search], select { font: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); min-height: 42px }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
table { width: 100%; border-collapse: collapse; font-size: 13.5px }
th { text-align: left; color: var(--ink-3); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--line); padding: 10px 12px; white-space: nowrap }
td { border-bottom: 1px solid var(--line-2); padding: 10px 12px; vertical-align: top; overflow-wrap: anywhere }
tr:last-child td { border-bottom: 0 }
td.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
tr.row { cursor: pointer } tr.row:hover td { background: var(--chip) }
.more { margin-top: 10px; font: inherit; font-size: 14px; background: var(--chip); border: 0; border-radius: 10px; padding: 10px 16px; color: var(--ink); cursor: pointer; min-height: 42px }
.empty { padding: 28px; text-align: center; color: var(--ink-3) }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 8px 10px; border-radius: 8px; max-width: 320px; opacity: 0; transition: opacity .1s; line-height: 1.5 }
#tip b { font-weight: 600 }
footer { margin-top: 48px; color: var(--ink-3); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 16px }
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-4.4-9.2-9A5.2 5.2 0 0 1 12 6.5 5.2 5.2 0 0 1 21.2 12C19 16.6 12 21 12 21z"/><path d="M7 12h3l1.5-2.5L13.5 15l1.5-3h2"/></svg>Context Doctor</div>
  <nav id="nav"></nav>
  <button class="iconbtn" id="theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div></div>
<main class="wrap">
  <div class="hero">
    <div class="card score" id="score"></div>
    <div>
      <div class="eyebrow" id="meta"></div>
      <h1 id="h1" style="font-size:30px;letter-spacing:-.02em;margin:4px 0 6px;font-weight:600"></h1>
      <p class="lede" id="lede"></p>
      <div class="tiles" id="tiles"></div>
    </div>
  </div>
  <section id="receive"><div class="eyebrow" data-t="s1e"></div><h2 data-t="s1h"></h2><p class="lede" id="s1l"></p><div class="card stack" id="stack"></div></section>
  <section id="weight"><div class="eyebrow" data-t="s2e"></div><h2 data-t="s2h"></h2><p class="lede" data-t="s2l"></p><div class="card"><div class="tm" id="tm"></div><div class="scale" id="tmscale" style="margin-top:12px"></div></div></section>
  <section id="findings"><div class="eyebrow" data-t="s3e"></div><h2 data-t="s3h"></h2><p class="lede" data-t="s3l"></p><div class="filters" id="ffilters"></div><div class="findings" id="flist"></div></section>
  <section id="hooks"><div class="eyebrow" data-t="s4e"></div><h2 data-t="s4h"></h2><p class="lede" data-t="s4l"></p><div class="flow" id="flow"></div></section>
  <section id="owners"><div class="eyebrow" data-t="s5e"></div><h2 data-t="s5h"></h2><p class="lede" data-t="s5l"></p><div class="owners" id="ownerGrid"></div></section>
  <section id="conflicts"><div class="eyebrow" data-t="s6e"></div><h2 data-t="s6h"></h2><p class="lede" data-t="s6l"></p><div id="pairs"></div></section>
  <section id="explore"><div class="eyebrow" data-t="s7e"></div><h2 data-t="s7h"></h2><div class="tabs" id="xtabs"></div><div id="xbody"></div></section>
  <footer id="foot"></footer>
</main>
<div id="tip" role="tooltip"></div>
<script>
const R = /*__DATA__*/null
const TH = R.lang === 'th'
const I = TH ? {
  nav: ['สิ่งที่โมเดลได้รับ', 'น้ำหนัก plugin', 'ปัญหา', 'Hooks', 'แย่งงาน', 'ข้อขัดแย้ง', 'สำรวจ'], theme: 'สลับธีม',
  h1: 'context ของ Claude Code ในโปรเจกต์นี้', lede: 'ทุกอย่างที่ถูกส่งให้โมเดลก่อนมันเริ่มคิด: memory ที่โหลดทุกครั้ง, รายการ skill, คำอธิบาย agent, hook ที่ทำงานเงียบ ๆ และคำสั่งจาก MCP · ตัวเลขเป็นค่าประมาณ',
  scanned: 'สแกน', health: 'Context health', bands: ['ดีเยี่ยม', 'ดี', 'พอใช้', 'ต้องปรับมาก', 'วิกฤต'],
  fromAudit: d => `คะแนนจาก <code>/context-doctor:audit</code> · ${d}`, autoScore: 'คะแนนอัตโนมัติ (ประมาณ) · รัน <code>/context-doctor:audit</code> เพื่อให้คะแนนที่ตรวจแล้ว',
  tiles: ['tokens โหลดทุกครั้ง', 'skills + commands', 'agent types', 'hook เปลี่ยนพฤติกรรม', 'MCP มี secret plaintext', 'ปัญหาที่พบ'],
  tileD: (m, p, a, h, s, v) => [`${m} ไฟล์ memory`, `≈${p}% ล้นงบ listing`, `${a} ตัวสั่งให้ใช้ทันที`, `ที่โมเดลไม่รู้ จาก ${h} hooks`, `จาก ${s} servers`, `${v} ข้อตรวจด้วยมือแล้ว`],
  s1e: '01 · สิ่งที่โมเดลได้รับ', s1h: 'context stack', s1l: b => `แถบบนคือสิ่งที่โหลดทุก session · แถบล่างคือ listing ของ skill: Claude Code มีที่ราว ${b} tokens ส่วนที่เกินถูกตัด description เหลือแค่ชื่อ โมเดลจึงไม่รู้ว่าควรใช้เมื่อไร`,
  always: 'โหลดทุกครั้ง', listing: 'Skill listing', need: (a, b) => `ต้องใช้ ≈${a} · มีที่ ≈${b} tokens`, fits: 'แสดงได้', withDesc: 'มี description', over: 'ล้นงบ', overTip: t => `≈${t} tokens ของ description ถูกตัดทิ้ง · เหลือแค่ชื่อ`, bareOnly: 'ถูกตัดเหลือแค่ชื่อ', viaImport: '@import จาก',
  s2e: '02 · น้ำหนัก vs การใช้งานจริง', s2h: 'plugin ไหนกิน listing แต่ไม่เคยถูกใช้', s2l: 'ขนาดกล่อง = token ใน listing · สี = สัดส่วนที่เคยถูกเรียกจริงใน transcript (จาง = ไม่เคยใช้) · ชี้เมาส์เพื่อดูรายละเอียด',

  $('#ffilters').innerHTML = [['all', `${I.all} ${R.findings.length}`], ['high', `${I.sev.high} ${cnt('high')}`], ['medium', `${I.sev.medium} ${cnt('medium')}`], ['low', `${I.sev.low} ${cnt('low')}`], ['verified', I.verified]]
    .map(([v, l]) => `<button class="pill ${v === 'all' ? 'on' : ''}" data-v="${v}">${l}</button>`).join('')
  $('#ffilters').onclick = e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.v; document.querySelectorAll('#ffilters .pill').forEach(p => p.classList.toggle('on', p === b)); draw() }
  draw()
}
// lifecycle
{
  const beh = new Map(R.behaviorHooks.map(h => [`${h.event}|${h.id || h.command}|${h.source}`, h]))
  const label = h => h.id || h.command.slice(0, 60)
  const events = Object.keys(I.events).filter(e => R.hooks.some(h => h.event === e))
  $('#flow').innerHTML = events.map((e, idx) => {
    const hs = R.hooks.filter(h => h.event === e)
    return `<div class="ev"><div class="evnode"><h4><span>${idx + 1}. ${e}</span><span class="c">${hs.length}</span></h4><div class="when">${I.events[e]}</div><div class="hk">${hs.map(h => {
      const b = beh.get(`${h.event}|${h.id || h.command}|${h.source}`)
      return `<span class="${b ? 'beh' + (b.documented ? ' doc' : '') : ''}" data-tip="<b>${esc(label(h))}</b><br>${esc(h.source)} · matcher ${esc(h.matcher)}${h.description ? '<br>' + esc(h.description) : ''}">${esc(label(h))}<small>${esc(h.source.replace('settings ', ''))}${h.matcher !== '*' && h.matcher !== '.*' ? ' · ' + esc(h.matcher) : ''}</small></span>`
    }).join('')}</div></div></div>`
  }).join('') || `<div class="card empty">${I.none}</div>`
}
// owners
$('#ownerGrid').innerHTML = R.topics.map(t => {
  const its = [...t.items].sort((a, b) => (isUsed(b) - isUsed(a)) || (b.aggressive - a.aggressive))
  return `<div class="card owner"><h4><span>${esc(t.topic)}</span><span class="sev ${sevCls(t.severity)}">${I.sev[t.severity]}</span></h4><div style="display:flex;align-items:baseline;gap:8px;margin-top:6px"><span class="cnt">${t.count}</span><span class="small muted">${I.claim(t.aggressive.length)}</span></div><div class="chips">${its.map(i => `<span class="chip ${isUsed(i) ? 'own' : i.aggressive ? 'hot' : ''}">${esc(i.name)}</span>`).join('')}</div></div>`
}).join('') || `<div class="card empty">${I.none}</div>`
// conflicts
{
  const rule = r => `<div class="rule"><span class="w ${r.type === 'never' ? 'no' : 'yes'}">${I.type[r.type]}</span>${esc(r.text)}<span class="s">${esc(r.source.includes('/') ? short(r.source) : r.source)}${r.line ? ` · ${I.line} ${r.line}` : ''}</span></div>`
  $('#pairs').innerHTML = R.ruleConflicts.map(c => `<h3 style="font-size:16px;margin:22px 0 10px;font-weight:600">${esc(c.subject)}</h3>${c.pairs.map(p => `<div class="pair"><div class="side"><h5>${I.alwaysSide}</h5>${p.always.map(rule).join('')}</div><div class="vs">⇄</div><div class="side"><h5>${I.otherSide}</h5>${p.opposite.slice(0, 4).map(rule).join('')}${p.opposite.length > 4 ? `<div class="small faint" style="margin-top:6px">${I.andMore(p.opposite.length - 4)}</div>` : ''}</div></div>`).join('')}`).join('') || `<div class="card empty">${I.none}</div>`
}
// explorer
{
  const allRules = [...R.harnessRules, ...R.memory.flatMap(m => m.rules), ...R.items.filter(i => !i.disabled).flatMap(i => i.rules)]
  const always = new Set(['Harness (system prompt)', ...R.memory.filter(m => !m.lazy).map(m => m.file)])
  const TABS = ['items', 'rules', 'plugins', 'mcp', 'dups'], counts = [R.items.length, allRules.length, R.plugins.length, R.mcp.length, R.duplicates.length]
  let tab = 'items'
  const drawTabs = () => { $('#xtabs').innerHTML = TABS.map((v, i) => `<button class="${v === tab ? 'on' : ''}" data-v="${v}">${I.tabs[i]} ${fmt(counts[i])}</button>`).join('') }
  $('#xtabs').onclick = e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.v; drawTabs(); body() } }
  const typeCell = t => `<span class="rule" style="padding:0;border:0"><span class="w ${t === 'never' ? 'no' : t === 'must' ? 'yes' : ''}">${I.type[t]}</span></span>`
  function body() {
    const X = $('#xbody')
    if (tab === 'items') {
      const srcs = [...new Set(R.items.map(i => i.plugin || i.source))]
      X.innerHTML = `<div class="toolbar"><input type="search" id="iq" placeholder="${I.search}"><select id="ik"><option value="">${I.allKinds}</option><option>skill</option><option>command</option><option>agent</option></select><select id="ip"><option value="">${I.allSrc}</option>${srcs.map(p => `<option>${esc(p)}</option>`).join('')}</select><select id="ia">${['', 'aggr', 'used', 'nodesc'].map((v, i) => `<option value="${v}">${I.filt[i]}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>${I.cols[0]}</th><th>${I.cols[1]}</th><th style="text-align:right">${I.cols[2]}</th><th style="text-align:right">${I.cols[3]}</th></tr></thead><tbody id="ib"></tbody></table></div><button class="more" id="im"></button>`
      let limit = 120, open = -1
      const draw = () => {
        const q = $('#iq').value.toLowerCase(), kk = $('#ik').value, p = $('#ip').value, a = $('#ia').value
        const list = R.items.filter(i => (!kk || i.kind === kk) && (!p || (i.plugin || i.source) === p) && (!a || (a === 'aggr' ? i.aggressive : a === 'used' ? isUsed(i) : !i.description)) && (!q || (i.name + i.description).toLowerCase().includes(q)))
        $('#ib').innerHTML = list.slice(0, limit).map(i => { const x = R.items.indexOf(i); return `<tr class="row" data-n="${x}"><td style="min-width:180px"><span class="mono">${esc(i.name)}</span><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px"><span class="chip">${i.kind}</span>${i.disabled ? `<span class="chip">${I.off}</span>` : ''}${i.aggressive ? `<span class="chip hot">${I.pressure}</span>` : ''}${isUsed(i) ? `<span class="chip own">${I.usedChip}</span>` : ''}</div></td><td class="small muted">${esc(i.description) || `<span style="color:var(--crit)">${I.noDesc}</span>`}</td><td class="r small">${fmt(i.descTokens)} / ${fmt(i.bodyTokens)}</td><td class="r">${i.rules.length}</td></tr>${open === x ? `<tr><td colspan="4" style="background:var(--bg)"><div class="mono faint" style="margin-bottom:6px">${esc(i.file)}</div>${i.rules.slice(0, 50).map(r => `<div class="rule"><span class="w ${r.type === 'never' ? 'no' : 'yes'}">${I.type[r.type]}</span>${esc(r.text)}<span class="s">${I.line} ${r.line}</span></div>`).join('') || `<span class="faint">${I.noRules}</span>`}</td></tr>` : ''}` }).join('') || `<tr><td colspan="4" class="empty">${I.notFound}</td></tr>`
        $('#im').style.display = list.length > limit ? '' : 'none'; $('#im').textContent = I.more(fmt(list.length - limit))
      }
      ;['iq', 'ik', 'ip', 'ia'].forEach(id => $('#' + id).addEventListener('input', () => { limit = 120; draw() }))
      $('#im').onclick = () => { limit += 300; draw() }
      $('#ib').onclick = e => { const tr = e.target.closest('tr.row'); if (tr) { const x = +tr.dataset.n; open = open === x ? -1 : x; draw() } }
      draw()
    } else if (tab === 'rules') {
      X.innerHTML = `<div class="toolbar"><input type="search" id="rq" placeholder="${I.searchRule}"><select id="rt"><option value="">${I.allTypes}</option>${['never', 'must', 'trigger'].map(t => `<option value="${t}">${I.type[t]}</option>`).join('')}</select><select id="rs"><option value="">${I.allSrc}</option><option value="1">${I.onlyAlways}</option></select></div><div class="tablewrap"><table><thead><tr><th style="width:90px">${I.rcols[0]}</th><th>${I.rcols[1]}</th><th style="width:220px">${I.rcols[2]}</th></tr></thead><tbody id="rb"></tbody></table></div><button class="more" id="rm"></button>`
      let limit = 150
      const draw = () => {
        const q = $('#rq').value.toLowerCase(), t = $('#rt').value, s = $('#rs').value
        const list = allRules.filter(r => (!t || r.type === t) && (!s || always.has(r.source)) && (!q || (r.text + r.source).toLowerCase().includes(q)))
        $('#rb').innerHTML = list.slice(0, limit).map(r => `<tr><td>${typeCell(r.type)}</td><td>${esc(r.text)}</td><td class="small faint">${esc(r.source.includes('/') ? short(r.source) : r.source)}${r.line ? ':' + r.line : ''}${always.has(r.source) ? ` · <b style="color:var(--accent)">${I.alwaysTag}</b>` : ''}</td></tr>`).join('') || `<tr><td colspan="3" class="empty">${I.notFound}</td></tr>`
        $('#rm').style.display = list.length > limit ? '' : 'none'; $('#rm').textContent = I.more(fmt(list.length - limit))
      }
      ;['rq', 'rt', 'rs'].forEach(id => $('#' + id).addEventListener('input', () => { limit = 150; draw() }))
      $('#rm').onclick = () => { limit += 400; draw() }
      draw()
    } else if (tab === 'plugins') {
      X.innerHTML = `<div class="tablewrap"><table><thead><tr>${I.pcols.map((c, i) => `<th${i > 1 && i < 6 ? ' style="text-align:right"' : ''}>${c}</th>`).join('')}</tr></thead><tbody>${R.plugins.map(p => `<tr><td><span class="mono">${esc(p.name)}</span> <span class="faint small">${esc(p.version)}</span><div class="small muted">${esc(p.description.slice(0, 150))}</div></td><td class="small">${esc(p.scope)}</td><td class="r">${p.counts.skill ?? '–'}</td><td class="r">${p.counts.command ?? '–'}</td><td class="r">${p.counts.agent ?? '–'}</td><td class="r">${p.counts.hooks ?? '–'}</td><td class="small">${p.enabled ? `<span class="chip own">${I.on}</span>` : `<span class="chip">${I.off}</span>`}${p.orphanedVersions ? ` <span class="faint">${I.stale(p.orphanedVersions)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div><p class="small faint">${I.pluginsNote}</p>`
    } else if (tab === 'mcp') {
      X.innerHTML = `<div class="tablewrap"><table><thead><tr>${I.mcols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${R.mcp.map(m => `<tr><td class="mono">${esc(m.name)}</td><td class="small">${esc(m.source)}</td><td class="small mono faint">${esc(m.transport)} · ${esc(m.target)}</td><td class="small">${m.secrets.length ? `<span class="chip hot">${I.plain}: ${esc(m.secrets.join(', '))}</span>` : ''}${m.disabled ? ` <span class="chip">${I.offProj}</span>` : ''}</td></tr>`).join('')}</tbody></table></div><p class="small faint">${I.mcpNote}</p>`
    } else {
      X.innerHTML = `<div class="tablewrap"><table><thead><tr><th>${I.dcols[0]}</th><th>${I.dcols[1]}</th></tr></thead><tbody>${R.duplicates.map(d => `<tr><td class="mono">${esc(d.name)}</td><td class="small">${d.items.map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`
    }
  }
  drawTabs(); body()
}
</script>
</body>
</html>
